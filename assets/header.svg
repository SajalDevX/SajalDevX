<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sajal Kumar Jana — Android and backend engineer">
  <style>
    :root { --fg:#1f2328; --mute:#656d76; --line:#d0d7de; --chip:#f6f8fa; --a1:#0969da; --a2:#8250df; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e6edf3; --mute:#8b949e; --line:#30363d; --chip:#161b22; --a1:#58a6ff; --a2:#bc8cff; }
    }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .fg { fill: var(--fg); } .mute { fill: var(--mute); }
    .h1 { font-size: 76px; font-weight: 700; letter-spacing: -2.5px; }
    .eyebrow { font-size: 13px; letter-spacing: 2.4px; font-weight: 600; }
    .sub { font-size: 21px; font-weight: 400; }
    .chip { font-size: 13px; letter-spacing: 0.4px; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .chipbox { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
  </style>
  <defs>
    <linearGradient id="acc" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <!-- eyebrow -->
  <text x="0" y="30" class="mono eyebrow mute">SAJAL KUMAR JANA</text>
  <text x="1200" y="30" text-anchor="end" class="mono eyebrow mute">PUNE, IN  ·  AIT  ·  B.E. IT ’27</text>
  <line x1="0" y1="46" x2="1200" y2="46" class="rule"/>

  <!-- headline -->
  <text x="-4" y="140" class="sans h1 fg">Android &amp; backend engineer.</text>
  <rect x="0" y="158" width="72" height="4" rx="2" fill="url(#acc)"/>

  <!-- sub -->
  <text x="0" y="203" class="sans sub mute">Founding engineer at PrepAiro — shipped a Flutter app to 150K+ installs and the real-time</text>
  <text x="0" y="233" class="sans sub mute">backend behind it. Now authoring terminal-agent benchmarks and fixing bugs upstream.</text>

  <!-- chips -->
  <g class="mono chip">
    <rect x="0" y="268" width="426" height="34" rx="17" class="chipbox"/>
    <circle cx="20" cy="285" r="4" fill="#3fb950"/>
    <text x="34" y="290" class="fg">now · benchmark tasks · AfterQuery, Handshake</text>

    <rect x="438" y="268" width="326" height="34" rx="17" class="chipbox"/>
    <text x="454" y="290" class="mute">prev · founding engineer · PrepAiro</text>

    <rect x="776" y="268" width="392" height="34" rx="17" class="chipbox"/>
    <text x="792" y="290" class="mute">1st of 2,000+ · eRaksha Hackathon, IIT Delhi</text>
  </g>
</svg>
